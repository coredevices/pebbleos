<?xml version="1.0" encoding="utf-8"?>
<!-- "The Weather Report" front page as a Timeline 80x80 icon: a miniature of the
     app's own newspaper screen (nameplate bar, thin rule, press-photo box + numbers
     column, footer band), with the folded corner from Pebble's News_event grammar
     and the next edition peeking out behind. Structure stroke 4 on integer coords,
     detail stroke 3 on .5 coords, straight lines only (PDC subset). -->
<svg version="1.1" id="Weather_report" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 80 80" enable-background="new 0 0 80 80" xml:space="preserve">
<polygon fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	16,14 70,14 70,70 16,70 "/>
<polygon fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	10,8 62,8 62,60 56,66 10,66 "/>
<polygon fill="#000000" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	16,14 56,14 56,21 16,21 "/>
<line fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="16.5" y1="26.5" x2="55.5" y2="26.5"/>
<polygon fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	16.5,33.5 32.5,33.5 32.5,49.5 16.5,49.5 "/>
<line fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="38.5" y1="36.5" x2="55.5" y2="36.5"/>
<line fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="38.5" y1="43.5" x2="52.5" y2="43.5"/>
<line fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="38.5" y1="49.5" x2="55.5" y2="49.5"/>
<line fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="16.5" y1="57.5" x2="49.5" y2="57.5"/>
</svg>
