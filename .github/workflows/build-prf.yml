name: Build PRF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  changes-prf:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-prf.yml'
              - 'boards/**'
              - 'platform/**'
              - 'resources/**'
              - 'src/**'
              - 'tools/**'
              - 'third_party/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'Kconfig'

  build-prf:
    needs: changes-prf
    if: needs.changes-prf.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v6

    strategy:
      matrix:
        board:
          - asterix
          - obelix@dvt
          - obelix@pvt
          - getafix@dvt
          - getafix@dvt2
        mode:
          - normal
          - mfg

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Set artifact board name
        id: artifact_board
        run: echo "NAME=$(printf '%s' "$BOARD" | tr @ _)" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}

      - name: Configure
        run: |
          if [ "${{ matrix.mode }}" == "mfg" ]; then
            OPTS="-DCONFIG_MFG=y -DCONFIG_LOG_HASHED=n"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            OPTS="${OPTS} -DCONFIG_RELEASE=y"
          fi

          ./pbl configure --board '${{ matrix.board }}' --variant prf $OPTS

      - name: Build
        run: ./pbl build

      - name: Bundle
        run: ./pbl bundle

      - name: Copy artifacts
        env:
          BOARD: ${{ steps.artifact_board.outputs.NAME }}
          MODE: ${{ matrix.mode }}
        run: |
          pbz=$(ls build/recovery_${BOARD}_*.pbz)
          version=$(basename "$pbz" | sed -E "s/^recovery_${BOARD}_//; s/\.pbz$//")

          mkdir artifacts
          if [ "$MODE" = "mfg" ]; then
            prefix="prf_mfg"
          else
            prefix="prf"
            cp "$pbz" artifacts/
            cp build/pebbleos_loghash_dict.json \
              "artifacts/prf_${BOARD}_${version}_loghash_dict.json"
          fi
          cp build/pebbleos.hex "artifacts/${prefix}_${BOARD}_${version}.hex"
          cp build/pebbleos.bin "artifacts/${prefix}_${BOARD}_${version}.bin"
          cp build/pebbleos.elf "artifacts/${prefix}_${BOARD}_${version}.elf"

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: prf-${{ steps.artifact_board.outputs.NAME }}-${{ matrix.mode }}
          path: artifacts

      - name: Get Build ID
        id: build_id
        run: |
          echo "BUILD_ID=$(readelf -n build/pebbleos.elf | sed -n -e 's/^.*Build ID: //p')" >> "$GITHUB_OUTPUT"

      - name: Upload log hash dictionary
        if: ${{ github.event_name == 'push' && github.repository == 'coredevices/PebbleOS' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LOG_HASH_BUCKET_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LOG_HASH_BUCKET_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install awscli
          aws s3 cp build/pebbleos_loghash_dict.json \
            "s3://${{ vars.LOG_HASH_BUCKET_NAME }}/${{ steps.build_id.outputs.BUILD_ID }}-${{ github.sha }}-prf.json" \
            --endpoint-url "${{ vars.LOG_HASH_BUCKET_ENDPOINT }}"

  build-prf-status:
    needs: [changes-prf, build-prf]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build-prf.result == 'failure' || needs.build-prf.result == 'cancelled'
        run: exit 1
